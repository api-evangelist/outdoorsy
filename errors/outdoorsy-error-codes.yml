rfc9457: false
notes: >-
  Outdoorsy does NOT use RFC 9457 problem+json. The two surfaces use two different envelopes, and
  neither is described by a schema in the published Swagger — every 4xx/5xx response in the contract
  declares a status code with no `schema` and no `description`. The envelopes below were captured
  from live responses; the code vocabulary is therefore partial (only codes actually observed or
  named in the contract are listed). Do not treat this list as exhaustive.
envelopes:
- surface: Outdoorsy API
  host: https://api.outdoorsy.com/v0
  content_type: application/json; charset=utf-8
  shape:
    error: human-readable message
    code: machine-readable error code (PascalCase)
    original_error: optional verbose underlying error detail (present on validation failures)
  example_401: '{"error":"You are not authorized to make that request.","code":"NotAuthorized"}'
  example_400: '{"error":"Please double check your entries and try again.","original_error":"Input errors:\n\n * limit: strconv.ParseInt: parsing \"abc\": invalid syntax\n","code":"InvalidFields"}'
- surface: Outdoorsy Search API
  host: https://search.outdoorsy.com
  content_type: text/plain; charset=utf-8
  shape:
    status: HTTP status as a string
    code: short alphanumeric code (E-prefixed)
    detail: human-readable detail
  example_404: '{"status":"404","code":"E102","detail":"No results"}'
  note: >-
    JSON:API-shaped error object served with a text/plain content type — a content-negotiation
    defect worth reporting to the provider.
