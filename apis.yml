apis:
- aid: outdoorsy:outdoorsy-api
  name: Outdoorsy API
  description: >-
    The core Outdoorsy REST API (Trailblazer Partner API). Resource-oriented URLs, standard HTTP
    verbs and response codes, semantic versioning, and 283 operations across rentals, bookings,
    booking proposals and items, quotes, availability, users, conversations and messaging, reviews,
    wishlists and favorites, banks and payouts, transactions, bundles, gift cards, ICS calendars,
    locations, usage-based items and admin/validation tooling.
  humanURL: https://developers.outdoorsy.com/api
  baseURL: https://api.outdoorsy.com/v0
  tags:
  - Rentals
  - Bookings
  - Payments
  - Marketplace
  - Travel
