aid: outdoorsy
name: Outdoorsy
description: >-
  Outdoorsy is an RV and campervan rental marketplace founded in 2014 and headquartered in Austin,
  Texas, connecting owners of recreational vehicles with travelers across North America, Europe and
  Australia/New Zealand. The Outdoorsy Group also operates Roamly (embedded RV insurance) and
  Wheelbase (RV rental fleet-management software). For developers, Outdoorsy publishes the
  Trailblazer Partner API at developers.outdoorsy.com — a REST platform with three integration
  surfaces: a fully-featured REST API for search, quoting, booking, payments and fleet management;
  INSTASearch embeddable JavaScript widgets; and partner deep links for attribution. Two live
  Swagger 2.0 contracts are published on the API hosts themselves — the core Outdoorsy API
  (api.outdoorsy.com/v0, 283 operations) and the Outdoorsy Search API (search.outdoorsy.com,
  JSON:API-formatted rental, campground, park and locality search).
image: https://avatars.githubusercontent.com/u/9725809?v=4
url: https://raw.githubusercontent.com/api-evangelist/outdoorsy/refs/heads/main/apis.yml
x-type: company
x-source: harvest:secondary-market
