  - type: ToolCrosswalk
    url: mcp/outdoorsy-tool-crosswalk.yml
- aid: outdoorsy:outdoorsy-search-api
  name: Outdoorsy Search API
  description: >-
    The Outdoorsy Search API — a read-only JSON:API-formatted search surface over rentals,
    campgrounds, external campgrounds, national/state parks, localities, breadcrumbs, users and
    vacation packages, with geo lookup by IP. 29 operations, page[limit]/page[offset] pagination,
    and a Total-Results response header.
  humanURL: https://developers.outdoorsy.com/api
  baseURL: https://search.outdoorsy.com
  tags:
  - Search
