      tags:
      - search
      operationId: searchBookingsRequest
      parameters:
      - x-go-name: Archived
        name: archived
        in: query
        schema:
          type: boolean
      - x-go-name: Filter
        name: filter
        in: query
        schema:
          type: string
      - x-go-name: Offset
        name: offset
        in: query
        schema:
          type: integer
          format: int64
      - x-go-name: Limit
        name: limit
        in: query
        schema:
          type: integer
          format: int64
      - x-go-name: Search
        name: search
        in: query
        schema:
          type: string
      - x-go-name: OrderBy
        name: order_by
        in: query
        schema:
          type: string
      - x-go-name: CreatedGT
        name: created_gt
        in: query
        schema:
          type: string
      - x-go-name: CreatedLT
        name: created_lt
        in: query
        schema:
          type: string
      - x-go-name: FromGT
        name: from_gt
        in: query
        schema:
          type: string
      - x-go-name: FromLT
        name: from_lt
        in: query
        schema:
          type: string
      - x-go-name: LocationsRaw
        name: location_ids
        in: query
        schema:
          type: string
      - x-go-name: StatusesRaw
        name: statuses
        in: query
        schema:
          type: string
      - x-go-name: New
        name: new
        in: query
        schema:
          type: boolean
      responses:
        '200':
          $ref: '#/components/responses/searchBookingsResponse'
        '400':
          $ref: '#/components/responses/badRequestError'
        '401':
          $ref: '#/components/responses/unauthorizedError'
  /search/global:
    get:
      description: Global Search
      tags:
      - search
      operationId: globalSearchRequest
      parameters:
      - x-go-name: Limit
        name: limit
        in: query
        schema:
          type: integer
          format: int64
      - x-go-name: Offset
        name: offset
        in: query
        schema:
          type: integer
          format: int64
      - x-go-name: Search
