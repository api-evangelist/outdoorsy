openapi: 3.2.0
info:
  description: 'The Outdoorsy API (or simply "API") is organized around REST. It uses

    predictable, resource-oriented URLs and implements standard HTTP response

    codes, verbs, authentication mechanisms, and a variety of request encodings.


    ## Versioning


    The API implements semantic versioning.'
  title: Outdoorsy API Documentation Gateways API
  version: 0.0.1
servers:
- url: /v0
security:
- Bearer:
  - '[]'
- API-Key:
  - '[]'
tags:
- name: gateways
paths:
  /gateways/fund_creation_form:
    get:
      description: Get gateway creation form
      tags:
      - gateways
      operationId: getGatewayCreationForm
      parameters:
      - x-go-name: GatewayType
        name: gateway_type
        in: query
        schema:
          type: string
      - x-go-name: AuthMode
        name: auth_mode
        in: query
        schema:
          type: string
      - x-go-name: GatewayID
        name: fund_id
        in: query
        schema:
          type: integer
          format: int64
      responses:
        '200':
          $ref: '#/components/responses/successResponse'
        '400':
          $ref: '#/components/responses/badRequestError'
        '401':
          $ref: '#/components/responses/unauthorizedError'
  /gateways/list_options:
    get:
      description: List available gateways
      tags:
      - gateways
      operationId: listGatewayOptions
      parameters:
      - x-go-name: CountryCode
        name: country_code
        in: query
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/successResponse'
        '400':
          $ref: '#/components/responses/badRequestError'
        '401':
          $ref: '#/components/responses/unauthorizedError'
  /users/gateways:
    get:
      description: List available gateways
      tags:
      - gateways
      operationId: listUserGateways
      parameters:
      - x-go-name: ID
        name: id
        in: query
        schema:
          type: integer
          format: int64
      - x-go-name: IDs
        name: ids
        in: query
        schema:
          type: string
      - x-go-name: OwnerID
        name: owner_id
        in: query
        schema:
          type: integer
          format: int64
      - x-go-name: LocationID
        name: location_id
        in: query
        schema:
          type: integer
          format: int64
      - x-go-name: RentalID
        name: rental_id
        in: query
        schema:
          type: integer
          format: int64
      - x-go-name: BookingID
        name: booking_id
        in: query
        schema:
          type: integer
          format: int64
      - x-go-name: Country
        name: country
        in: query
        schema:
          type: string
      - x-go-name: Archived
        name: archived
        in: query
        schema:
          type: boolean
      - x-go-name: ManagedAccountsOnly
        name: managed_accounts_only
        in: query
        schema:
          type: boolean
      - x-go-name: Limit
        name: limit
        in: query
        schema:
          type: integer
          format: int64
      - x-go-name: Offset
        name: offset
        in: query
        schema:
          type: integer
          format: int64
      - x-go-name: Order
        name: order
        in: query
        schema:
          type: string
      - x-go-name: FundType
        name: fund_type
        in: query
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/listBankResponse'
        '400':
          $ref: '#/components/responses/badRequestError'
        '401':
          $ref: '#/components/responses/unauthorizedError'
    post:
      description: Create payment gateway
      tags:
      - gateways
      operationId: createGateway
      responses:
        '200':
          $ref: '#/components/responses/userResponse'
        '400':
          $ref: '#/components/responses/badRequestError'
        '401':
          $ref: '#/components/responses/unauthorizedError'
  /users/gateways/{id}:
    delete:
      description: Archive payment gateway
      tags:
      - gateways
      operationId: archiveUserGateway
      parameters:
      - x-go-name: ID
        name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '204':
          $ref: '#/components/responses/noContentResponse'
        '400':
          $ref: '#/components/responses/badRequestError'
        '401':
          $ref: '#/components/responses/unauthorizedError'
