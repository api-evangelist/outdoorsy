openapi: 3.2.0
info:
  description: 'The Outdoorsy API (or simply "API") is organized around REST. It uses

    predictable, resource-oriented URLs and implements standard HTTP response

    codes, verbs, authentication mechanisms, and a variety of request encodings.


    ## Versioning


    The API implements semantic versioning.'
  title: Outdoorsy API Documentation Reports API
  version: 0.0.1
servers:
- url: /v0
security:
- Bearer:
  - '[]'
- API-Key:
  - '[]'
tags:
- name: reports
paths:
  /reports/checkout-questions:
    get:
      description: Generate checkout questions report request
      tags:
      - reports
      operationId: checkoutQuestionsReport
      responses:
        '200':
          $ref: '#/components/responses/checkoutQuestionsReportResponse'
        '400':
          $ref: '#/components/responses/badRequestError'
        '401':
          $ref: '#/components/responses/unauthorizedError'
  /reports/credit:
    get:
      description: Generate credit report request
      tags:
      - reports
      operationId: creditReportRequest
      parameters:
      - x-go-name: IsOutstanding
        name: outstanding
        in: query
        schema:
          type: boolean
      - x-go-name: Consumed
        name: consumed
        in: query
        schema:
          type: boolean
      - x-go-name: From
        name: from
        in: query
        schema:
          type: string
      - x-go-name: To
        name: to
        in: query
        schema:
          type: string
      - x-go-name: Limit
        name: limit
        in: query
        schema:
          type: integer
          format: uint64
      - x-go-name: Offset
        name: offset
        in: query
        schema:
          type: integer
          format: uint64
      - x-go-name: LocationsRaw
        name: location_ids
        in: query
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/creditReportResponse'
        '400':
          $ref: '#/components/responses/badRequestError'
        '401':
          $ref: '#/components/responses/unauthorizedError'
  /reports/end-of-day:
    get:
      description: Generate end of day report request
      tags:
      - reports
      operationId: endOfDayReportRequest
      parameters:
      - x-go-name: From
        name: from
        in: query
        schema:
          type: string
      - x-go-name: To
        name: to
        in: query
        schema:
          type: string
      - x-go-name: LocationsRaw
        name: location_ids
        in: query
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/endOfDayReportResponse'
        '400':
          $ref: '#/components/responses/badRequestError'
        '401':
          $ref: '#/components/responses/unauthorizedError'
  /reports/rental-prep:
    get:
      description: Generate morning report request
      tags:
      - reports
      operationId: morningReportRequest
      parameters:
      - x-go-name: Status
        name: status
        in: query
        schema:
          type: string
      - x-go-name: LocationsRaw
        name: location_ids
        in: query
        schema:
          type: string
      - x-go-name: Start
        name: start
        in: query
        schema:
          type: string
      - x-go-name: End
        name: end
        in: query
        schema:
          type: string
      - x-go-name: SkipNextDeparture
        name: skip_next_departure
        in: query
        schema:
          type: boolean
      - x-go-name: ShowDeparting
        name: show_departing
        in: query
        schema:
          type: boolean
      - x-go-name: ShowReturning
        name: show_returning
        in: query
        schema:
          type: boolean
      - x-go-name: Offset
        name: offset
        in: query
        schema:
          type: integer
          format: uint64
      - x-go-name: Limit
        name: limit
        in: query
        schema:
          type: integer
          format: uint64
      responses:
        '200':
          $ref: '#/components/responses/morningReportResponse'
        '400':
          $ref: '#/components/responses/badRequestError'
        '401':
          $ref: '#/components/responses/unauthorizedError'
  /reports/security-deposits:
    get:
      description: Generate security deposits report request
      tags:
      - reports
      operationId: securityDepositsReport
      responses:
        '200':
          $ref: '#/components/responses/securityDepositsReportResponse'
        '400':
          $ref: '#/components/responses/badRequestError'
        '401':
          $ref: '#/components/responses/unauthorizedError'
