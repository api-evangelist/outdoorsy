openapi: 3.2.0
info:
  description: 'The Outdoorsy API (or simply "API") is organized around REST. It uses

    predictable, resource-oriented URLs and implements standard HTTP response

    codes, verbs, authentication mechanisms, and a variety of request encodings.


    ## Versioning


    The API implements semantic versioning.'
  title: Outdoorsy API Documentation Messages API
  version: 0.0.1
servers:
- url: /v0
security:
- Bearer:
  - '[]'
- API-Key:
  - '[]'
tags:
- name: messages
paths:
  /messages:
    get:
      description: Returns a list of messages based on search criteria
      tags:
      - messages
      operationId: listMessages
      parameters:
      - name: OrderBy
        in: query
        schema:
          type: string
      - name: Offset
        in: query
        schema:
          type: integer
          format: int64
      - name: Limit
        in: query
        schema:
          type: integer
          format: int64
      - name: ConversationID
        in: query
        schema:
          type: integer
          format: int64
      - name: UserID
        in: query
        schema:
          type: integer
          format: int64
      - name: ReceiverID
        in: query
        schema:
          type: integer
          format: int64
      - name: SenderID
        in: query
        schema:
          type: integer
          format: int64
      - name: Sentiments
        in: query
        schema:
          type: array
          items:
            type: string
      - x-go-type: github.com/outdoorsy/api/clocks.RfcTime
        name: From
        in: query
        schema:
          type: string
      - x-go-type: github.com/outdoorsy/api/clocks.RfcTime
        name: To
        in: query
        schema:
          type: string
      - name: SkipBannedFilter
        in: query
        schema:
          type: boolean
      responses:
        '200':
          $ref: '#/components/responses/messagesResponse'
        '400':
          $ref: '#/components/responses/badRequestError'
        '401':
          $ref: '#/components/responses/unauthorizedError'
        '404':
          $ref: '#/components/responses/notFoundError'
        default:
          $ref: '#/components/responses/genericError'
    post:
      tags:
      - messages
      summary: Creates a new message as part of a conversation between owner and renter.
      operationId: createMessage
      responses:
        '200':
          $ref: '#/components/responses/messageResponse'
        '400':
          $ref: '#/components/responses/badRequestError'
        '401':
          $ref: '#/components/responses/unauthorizedError'
        '404':
          $ref: '#/components/responses/notFoundError'
        default:
          $ref: '#/components/responses/genericError'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Message'
  /messages/twilio/sms:
    get:
      description: Returns the reply if someone responds to one of our twilio sms messages
      tags:
      - messages
      operationId: getTwilioSmsReply
      responses:
        '200':
          $ref: '#/components/responses/string'
        '400':
          $ref: '#/components/responses/badRequestError'
        '401':
          $ref: '#/components/responses/unauthorizedError'
        '404':
          $ref: '#/components/responses/notFoundError'
        default:
          $ref: '#/components/responses/genericError'
  /messages/{id}:
    get:
      description: Returns a message by id
      tags:
      - messages
      operationId: getMessageById
      parameters:
      - x-go-name: ID
        name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          $ref: '#/components/responses/messageResponse'
        '400':
          $ref: '#/components/responses/badRequestError'
        '401':
          $ref: '#/components/responses/unauthorizedError'
        '404':
          $ref: '#/components/responses/notFoundError'
        default:
          $ref: '#/components/responses/genericError'
    patch:
      description: Marks a message as being read or unread
      tags:
      - messages
      operationId: updateMessage
      parameters:
      - x-go-name: ID
        name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          $ref: '#/components/responses/messageResponse'
        '400':
          $ref: '#/components/responses/badRequestError'
        '401':
          $ref: '#/components/responses/unauthorizedError'
        '404':
          $ref: '#/components/responses/notFoundError'
        default:
          $ref: '#/components/responses/genericError'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageUpdate'
