openapi: 3.2.0
info:
  description: 'The Outdoorsy API (or simply "API") is organized around REST. It uses

    predictable, resource-oriented URLs and implements standard HTTP response

    codes, verbs, authentication mechanisms, and a variety of request encodings.


    ## Versioning


    The API implements semantic versioning.'
  title: Outdoorsy API Documentation Reviews API
  version: 0.0.1
servers:
- url: /v0
security:
- Bearer:
  - '[]'
- API-Key:
  - '[]'
tags:
- name: reviews
paths:
  /aggregate-reviews-for-locality:
    get:
      description: Return a aggregation for reviews for given locality
      tags:
      - reviews
      operationId: aggregateLocalityReviews
      parameters:
      - x-go-name: Lat
        name: lat
        in: query
        schema:
          type: number
          format: double
      - x-go-name: Lng
        name: lng
        in: query
        schema:
          type: number
          format: double
      - x-go-name: LocalityType
        name: locality_type
        in: query
        schema:
          type: string
      - x-go-name: RegionCode
        name: region_code
        in: query
        schema:
          type: string
      - x-go-name: RentalCategory
        name: rental_category
        in: query
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/aggregateLocalityReviewsResponse'
  /reviews:
    get:
      description: Return a list of reviews
      tags:
      - reviews
      operationId: listReviews
      parameters:
      - x-go-name: ReviewerID
        name: reviewer_id
        in: query
        schema:
          type: integer
          format: int64
      - x-go-name: RentalID
        name: rental_id
        in: query
        schema:
          type: integer
          format: int64
      - x-go-name: RentalIDs
        name: rental_ids
        in: query
        schema:
          type: array
          items:
            type: integer
            format: int64
      - x-go-name: UserID
        name: user_id
        in: query
        schema:
          type: integer
          format: int64
      - x-go-name: BookingID
        name: booking_id
        in: query
        schema:
          type: integer
          format: int64
      - x-go-name: OwnerID
        name: owner_id
        in: query
        schema:
          type: integer
          format: int64
      - x-go-name: TimestampLTE
        name: timestamp_lte
        in: query
        schema:
          type: string
      - x-go-name: TimestampGTE
        name: timestamp_gte
        in: query
        schema:
          type: string
      - x-go-name: ScoreLTE
        name: score_lte
        in: query
        schema:
          type: number
          format: double
      - x-go-name: ScoreGTE
        name: score_gte
        in: query
        schema:
          type: number
          format: double
      - x-go-name: Scores
        name: scores
        in: query
        schema:
          type: array
          items:
            type: integer
            format: int64
      - x-go-name: Search
        name: search
        in: query
        schema:
          type: string
      - x-go-name: Limit
        name: limit
        in: query
        schema:
          type: integer
          format: int64
      - x-go-name: Offset
        name: offset
        in: query
        schema:
          type: integer
          format: int64
      - x-go-name: Order
        name: order
        in: query
        schema:
          type: string
      - x-go-name: Lat
        name: lat
        in: query
        schema:
          type: number
          format: double
      - x-go-name: Lng
        name: lng
        in: query
        schema:
          type: number
          format: double
      - x-go-name: State
        name: state
        in: query
        schema:
          type: string
      - x-go-name: Radius
        name: radius
        in: query
        schema:
          type: number
          format: double
      - x-go-name: IncludeImages
        name: images
        in: query
        schema:
          type: boolean
      - x-go-name: ExcludedFromRating
        name: exclude_from_rating
        in: query
        schema:
          type: boolean
      - x-go-name: IncludeDeleted
        name: deleted
        in: query
        schema:
          type: boolean
      - x-go-name: IncludeAll
        name: include_all
        in: query
        schema:
          type: boolean
      - x-go-name: OnlyPublished
        name: only_published
        in: query
        schema:
          type: boolean
      - x-go-name: OmitWithoutText
        name: omit_without_text
        in: query
        schema:
          type: boolean
      - x-go-name: OmitHidden
        name: omit_hidden
        in: query
        schema:
          type: boolean
      - x-go-name: OwnerSlug
        name: owner_slug
        in: query
        schema:
          type: string
      - x-go-name: CSVToken
        name: csv-token
        in: query
        schema:
          type: string
      - x-go-name: CSV
        name: csv
        in: query
        schema:
          type: boolean
      - name: LocationIDs
        in: query
        schema:
          type: array
          items:
            type: string
      - x-go-name: LocationsRaw
        name: location_ids
        in: query
        schema:
          type: string
      - x-go-name: CampgroundID
        name: campground_id
        in: query
        schema:
          type: string
      - x-go-name: OnlyRentalReviews
        name: only_rental_reviews
        in: query
        schema:
          type: boolean
      - x-go-name: RentalCategory
        name: rental_category
        in: query
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/reviewsResponse'
        '401':
          $ref: '#/components/responses/unauthorizedError'
        '404':
          $ref: '#/components/responses/notFoundError'
    post:
      description: Create a new review for a user or rental owner
      tags:
      - reviews
      operationId: createReview
      responses:
        '200':
          $ref: '#/components/responses/reviewResponse'
        '401':
          $ref: '#/components/responses/unauthorizedError'
        '404':
          $ref: '#/components/responses/notFoundError'
        default:
          $ref: '#/components/responses/genericError'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Review'
  /reviews-for-locality:
    get:
      description: Return a list of reviews for given locality
      tags:
      - reviews
      operationId: listLocalityReviews
      parameters:
      - x-go-name: Lat
        name: lat
        in: query
        schema:
          type: number
          format: double
      - x-go-name: Lng
        name: lng
        in: query
        schema:
          type: number
          format: double
      - x-go-name: State
        name: state
        in: query
        schema:
          type: string
      - x-go-name: RentalCategory
        name: rental_category
        in: query
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/localityReviewsResponse'
  /reviews/{id}:
    get:
      description: Return a single review by id
      tags:
      - reviews
      operationId: getReviewById
      parameters:
      - x-go-name: ID
        name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          $ref: '#/components/responses/reviewResponse'
        '401':
          $ref: '#/components/responses/unauthorizedError'
        '404':
          $ref: '#/components/responses/notFoundError'
    patch:
      description: Update a review
      tags:
      - reviews
      operationId: updateReview
      parameters:
      - x-go-name: ID
        name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          $ref: '#/components/responses/reviewResponse'
        '401':
          $ref: '#/components/responses/unauthorizedError'
        '404':
          $ref: '#/components/responses/notFoundError'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewUpdateOptions'
components:
  responses:
    notFoundError:
      description: Not found error
    localityReviewsResponse:
      description: HTTP status code 200 and array of localityReview model
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/LocalityReview'
    reviewsResponse:
      description: HTTP status code 200 and array of review model
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/Review'
    reviewResponse:
      description: HTTP status code 200 and review model
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Review'
    unauthorizedError:
      description: Unauthorized error
    aggregateLocalityReviewsResponse:
      description: HTTP status code 200 and ReviewsMeta model
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ReviewsMeta'
    genericError:
      description: An unknown, unexpected error.
  schemas:
    ReviewUpdateOptions:
      description: for swagger docs
      type: object
      properties:
        cleanliness_score:
          type: number
          format: double
          x-go-name: CleanlinessScore
        communication_score:
          type: number
          format: double
          x-go-name: CommunicationScore
        images:
          description: array of urls
          type: array
          items:
            type: string
          x-go-name: Images
        listing_score:
          type: number
          format: double
          x-go-name: ListingAccuracyScore
        mechanical_score:
          type: number
          format: double
          x-go-name: MechanicalScore
        owner_response:
          $ref: '#/components/schemas/OwnerResponseReview'
        score:
          type: number
          format: double
          x-go-name: Score
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
          x-go-name: Tags
        text:
          description: reviewer can update these values
          type: string
          x-go-name: Text
        user_recommend:
          type: boolean
          x-go-name: UserRecommend
        value_score:
          type: number
          format: double
          x-go-name: ValueScore
      x-go-package: github.com/outdoorsy/api/model
    LocalityReview:
      type: object
      properties:
        id:
          type: integer
          format: int64
          x-go-name: ID
        rental_lat:
          type: number
          format: double
          x-go-name: RentalLat
        rental_lng:
          type: number
          format: double
          x-go-name: RentalLng
        rental_summary:
          $ref: '#/components/schemas/RentalSummary'
        reviewer:
          $ref: '#/components/schemas/Reviewer'
        score:
          type: number
          format: double
          x-go-name: Score
        text:
          type: string
          x-go-name: Text
        timestamp:
          type: string
          x-go-name: Timestamp
          x-go-type: github.com/outdoorsy/api/clocks.RfcTime
      x-go-package: github.com/outdoorsy/api/cmd/web/handlers
    ReviewsMeta:
      type: object
      properties:
        avg_cleanliness_score:
          type: number
          format: double
          x-go-name: AvgCleanlinessScore
        avg_communication_score:
          type: number
          format: double
          x-go-name: AvgCommunicationScore
        avg_listing_score:
          type: number
          format: double
          x-go-name: AvgListingScore
        avg_mechanical_score:
          type: number
          format: double
          x-go-name: AvgMechanicalScore
        avg_score:
          type: number
          format: double
          x-go-name: AvgScore
        avg_value_score:
          type: number
          format: double
          x-go-name: AvgValueScore
        max_score:
          type: number
          format: double
          x-go-name: MaxScore
        min_score:
          type: number
          format: double
          x-go-name: MinScore
        reviews_count:
          type: integer
          format: int64
          x-go-name: ReviewsCount
        time_hosting_msg:
          type: string
          x-go-name: TimeHostingMsg
        time_hosting_num:
          type: integer
          format: int64
          x-go-name: TimeHostingNum
      x-go-package: github.com/outdoorsy/api/internal/reviews
    ReviewOwner:
      type: object
      properties:
        avatar_url:
          type: string
          x-go-name: AvatarURL
        first_name:
          type: string
          x-go-name: FirstName
        id:
          type: integer
          format: int64
          x-go-name: ID
        last_name:
          type: string
          x-go-name: LastName
      x-go-package: github.com/outdoorsy/api/model
    OwnerResponseReview:
      type: object
      properties:
        text:
          type: string
          x-go-name: Text
        timestamp:
          type: string
          x-go-name: Timestamp
          x-go-type: github.com/outdoorsy/api/clocks.RfcTime
      x-go-package: github.com/outdoorsy/api/model
    ID:
      description: 'ID is the type used throughout the system to identify a unique object. It

        properly handles marshaling for both json and sql databases. It properly

