openapi: 3.2.0
info:
  description: 'The Outdoorsy API (or simply "API") is organized around REST. It uses

    predictable, resource-oriented URLs and implements standard HTTP response

    codes, verbs, authentication mechanisms, and a variety of request encodings.


    ## Versioning


    The API implements semantic versioning.'
  title: Outdoorsy API Documentation Rental Images API
  version: 0.0.1
servers:
- url: /v0
security:
- Bearer:
  - '[]'
- API-Key:
  - '[]'
tags:
- name: rentalImages
paths:
  /rentals/{rental_id}/image-order:
    patch:
      description: Updates position on rental images and optionally set new primary image
      tags:
      - rentalImages
      operationId: orderRentalImages
      parameters:
      - x-go-name: RentalID
        name: rental_id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          $ref: '#/components/responses/rentalImagesResponse'
        '401':
          $ref: '#/components/responses/unauthorizedError'
        default:
          $ref: '#/components/responses/genericError'
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/ImageOrder'
  /rentals/{rental_id}/images:
    get:
      description: Retrieve list of rental images for rental id
      tags:
      - rentalImages
      operationId: listRentalImages
      parameters:
      - x-go-name: RentalID
        name: rental_id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          $ref: '#/components/responses/rentalImagesResponse'
        '401':
          $ref: '#/components/responses/unauthorizedError'
        default:
          $ref: '#/components/responses/genericError'
    post:
      tags:
      - rentalImages
      summary: Creates, updates, and deletes a set of rental images based on list of objects.
      operationId: setRentalImages
      parameters:
      - x-go-name: RentalID
        name: rental_id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          $ref: '#/components/responses/rentalImagesResponse'
        '401':
          $ref: '#/components/responses/unauthorizedError'
        default:
          $ref: '#/components/responses/genericError'
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/RentalImage'
  /rentals/{rental_id}/images/raw:
    post:
      description: Create a single rental image using raw binary file upload
      tags:
      - rentalImages
      operationId: createRawRentalImage
      responses:
        '201':
          $ref: '#/components/responses/rentalImageResponse'
        '401':
          $ref: '#/components/responses/unauthorizedError'
        default:
          $ref: '#/components/responses/genericError'
  /rentals/{rental_id}/images/{id}:
    get:
      description: Retrieve a single rental image by id
      tags:
      - rentalImages
      operationId: getRentalImageById
      parameters:
      - x-go-name: RentalID
        name: rental_id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - x-go-name: ID
        name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          $ref: '#/components/responses/rentalImageResponse'
        '401':
          $ref: '#/components/responses/unauthorizedError'
        default:
          $ref: '#/components/responses/genericError'
    delete:
      description: Deletes the requested rental image by id
      tags:
      - rentalImages
      operationId: deleteRentalImageById
      parameters:
      - x-go-name: RentalID
        name: rental_id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - x-go-name: ID
        name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '204':
          $ref: '#/components/responses/noContentResponse'
        '401':
          $ref: '#/components/responses/unauthorizedError'
        default:
          $ref: '#/components/responses/genericError'
    patch:
      description: Update rental image by id
      tags:
      - rentalImages
      operationId: updateRentalImage
      parameters:
      - x-go-name: RentalID
        name: rental_id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - x-go-name: ID
        name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          $ref: '#/components/responses/rentalImageResponse'
        '401':
          $ref: '#/components/responses/unauthorizedError'
        default:
          $ref: '#/components/responses/genericError'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RentalImage'
