openapi: 3.2.0
info:
  description: 'The Outdoorsy API (or simply "API") is organized around REST. It uses

    predictable, resource-oriented URLs and implements standard HTTP response

    codes, verbs, authentication mechanisms, and a variety of request encodings.


    ## Versioning


    The API implements semantic versioning.'
  title: Outdoorsy API Documentation Convert Currency API
  version: 0.0.1
servers:
- url: /v0
security:
- Bearer:
  - '[]'
- API-Key:
  - '[]'
tags:
- name: Convert Currency
paths:
  /convert-currency:
    get:
      summary: Converts currency.
      operationId: convertCurrency
      parameters:
      - x-go-name: From
        name: from
        in: path
        required: true
        schema:
          type: string
      - x-go-name: To
        name: to
        in: path
        required: true
        schema:
          type: string
      - x-go-name: Amount
        name: amount
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          $ref: '#/components/responses/convertCurrencyResponse'
        '401':
          $ref: '#/components/responses/unauthorizedError'
      tags:
      - Convert Currency
components:
  schemas:
    convertCurrencyResponseBody:
      type: object
      properties:
        amount:
          type: integer
          format: int64
          x-go-name: Amount
      x-go-package: github.com/outdoorsy/api/cmd/web/handlers
  responses:
    unauthorizedError:
      description: Unauthorized error
    convertCurrencyResponse:
      description: ''
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/convertCurrencyResponseBody'
  securitySchemes:
    API-Key:
      type: apiKey
      name: API-Key
      in: header
    Bearer:
      type: apiKey
      name: Authorization
      in: header
